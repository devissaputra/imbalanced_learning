<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Class Imbalance & Model Strategy</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">The experiment compares standard learning against class-weighted learning.</text>
<rect x="70" y="175" width="330" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="105" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#1e40af">Imbalanced training set</text>
<rect x="115" y="300" width="205" height="60" rx="12" fill="#bfdbfe"/><text x="217" y="338" text-anchor="middle" font-family="Arial" font-size="20" fill="#1e3a8a">majority class</text>
<rect x="115" y="390" width="70" height="60" rx="12" fill="#fecaca"/><text x="150" y="428" text-anchor="middle" font-family="Arial" font-size="20" fill="#991b1b">rare</text>
<text x="105" y="500" font-family="Arial" font-size="19" fill="#64748b">Same real observations,</text><text x="105" y="528" font-family="Arial" font-size="19" fill="#64748b">controlled sampling only.</text>
<rect x="450" y="175" width="300" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#166534">Model comparison</text>
<rect x="495" y="285" width="210" height="80" rx="14" fill="#ecfeff"/><text x="600" y="325" text-anchor="middle" font-family="Arial" font-size="20" fill="#155e75">Logistic regression</text><text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="17" fill="#155e75">standard loss</text>
<rect x="495" y="405" width="210" height="80" rx="14" fill="#dcfce7"/><text x="600" y="445" text-anchor="middle" font-family="Arial" font-size="20" fill="#166534">Balanced models</text><text x="600" y="470" text-anchor="middle" font-family="Arial" font-size="17" fill="#166534">class-weighted loss</text>
<rect x="800" y="175" width="330" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="835" y="220" font-family="Arial" font-size="23" font-weight="700" fill="#7e22ce">Evaluation focus</text>
<text x="845" y="305" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Average Precision</text><text x="845" y="340" font-family="Arial" font-size="18" fill="#64748b">precision-recall summary</text>
<text x="845" y="415" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">F1 score</text><text x="845" y="450" font-family="Arial" font-size="18" fill="#64748b">precision/recall balance</text>
<path d="M400 365 H450" stroke="#2563eb" stroke-width="5"/><path d="M750 365 H800" stroke="#2563eb" stroke-width="5"/>
</svg>